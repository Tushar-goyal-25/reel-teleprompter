<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF7F5">
<title>Prompter</title>
<meta name="description" content="A teleprompter that keeps your words right under the lens while you record.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<style>
:root{--bg:#FFF7F5;--card:#FFFFFF;--line:#F3E2E3;--ink:#2B2230;--muted:#8A7B8C;--cue:#B07BE0;--pearl:linear-gradient(120deg,#F2917F,#D879B4 55%,#8F78E8);--rec:#FF4D5E;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
.hide{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer}
:focus-visible{outline:3px solid var(--cue);outline-offset:2px}

/* edit */
#edit{height:100%;display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
header{display:flex;align-items:center;gap:12px}
header img{width:44px;height:44px;border-radius:12px;box-shadow:0 8px 20px #e7a6c855}
header h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
header p{font-size:14px;color:var(--muted)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
textarea{flex:1;width:100%;border:0;background:transparent;padding:18px;font-size:18px;line-height:1.5;resize:none;outline:none}
textarea::placeholder{color:#C2B3BF}
.meta{padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.controls{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 16px}
.ctl{display:flex;align-items:center;gap:12px;min-height:52px}
.ctl+.ctl{border-top:1px solid var(--line)}
.ctl label,.ctl>span:first-child{width:78px;font-size:15px;color:var(--muted)}
.ctl output{width:32px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#F2917F,#D879B4 var(--p,50%),#F3E2E3 var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#F2917F,#D879B4 var(--p,50%),#F3E2E3 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #d879b466,0 0 0 1px #f3e2e3}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px #d879b466}
.seg{flex:1;display:flex;background:#FBEDEC;border-radius:12px;padding:3px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{flex:1;width:auto;text-align:center;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);cursor:pointer}
.seg input:checked+label{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px #2b22301a}
.seg input:focus-visible+label{outline:3px solid var(--cue)}
.go{padding:17px;border-radius:18px;background:var(--pearl);color:#fff;font-size:18px;font-weight:700;text-shadow:0 1px 2px #6a2f6a55;box-shadow:0 10px 24px #e7a6c870}
.go:active{transform:scale(.99)}

/* record */
#rec{position:fixed;inset:0;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.glass{background:#fff8f6d9;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);color:var(--ink)}
#prompt{position:absolute;top:0;left:0;right:0;height:25%;padding-top:env(safe-area-inset-top);overflow:hidden;border-radius:0 0 26px 26px;
  -webkit-mask-image:linear-gradient(#0004,#000 38%,#000 58%,#0004);mask-image:linear-gradient(#0004,#000 38%,#000 58%,#0004)}
#text{max-width:min(72vw,300px);margin:0 auto;text-align:center;padding:12vh 0 100vh;font-weight:650;line-height:1.35;white-space:pre-wrap;will-change:transform}
#chunk{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);width:min(80vw,330px);
  text-align:center;font-weight:700;line-height:1.25;border-radius:22px;padding:14px 16px;min-height:1.6em;box-shadow:0 10px 30px #0003}
#progress{position:absolute;left:0;bottom:0;height:3px;background:var(--pearl);width:0}
#bar{position:absolute;bottom:0;left:0;right:0;padding:16px 22px calc(env(safe-area-inset-bottom) + 22px);display:flex;align-items:center;justify-content:space-between}
.pill{padding:12px 16px;border-radius:999px;font-size:15px;font-weight:600;min-width:76px}
#recBtn{width:78px;height:78px;border-radius:50%;background:#fff8f6e6;display:grid;place-items:center;box-shadow:0 6px 20px #0004}
#recBtn i{display:block;width:58px;height:58px;border-radius:50%;background:var(--rec);transition:all .2s}
#recBtn.on i{width:28px;height:28px;border-radius:8px}
#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#count span{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:64px;font-weight:700}
#timer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 118px);left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
#timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec)}

/* done */
#done{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
#done h2{font-size:22px}
#out{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:22px;background:#F6E6E6}
.sec{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section id="edit">
  <header>
    <img src="/icon.svg" alt="">
    <div><h1>Prompter</h1><p>Your words, right under the lens.</p></div>
  </header>
  <div class="sheet">
    <textarea id="script" aria-label="Script" placeholder="Paste or type your script. It saves on this phone as you go."></textarea>
    <div class="meta" id="meta">No script yet</div>
  </div>
  <div class="controls">
    <div class="ctl"><span>Mode</span>
      <div class="seg" role="radiogroup" aria-label="Mode">
        <input type="radio" name="mode" id="m-scroll" value="scroll"><label for="m-scroll">Scroll</label>
        <input type="radio" name="mode" id="m-chunk" value="chunk"><label for="m-chunk">Phrases</label>
      </div></div>
    <div class="ctl"><label for="speed">Speed</label><input id="speed" type="range" min="10" max="150" value="45"><output id="speedV"></output></div>
    <div class="ctl"><label for="size">Text size</label><input id="size" type="range" min="18" max="56" value="30"><output id="sizeV"></output></div>
  </div>
  <button class="go" id="go">Open camera</button>
</section>

<section id="rec" class="hide">
  <video id="cam" autoplay playsinline muted></video>
  <div id="prompt" class="glass"><div id="text"></div></div>
  <div id="chunk" class="glass hide"></div>
  <div id="timer" class="glass hide">0:00</div>
  <div id="count" class="hide"><span class="glass"></span></div>
  <div id="bar">
    <button class="pill glass" id="back">Edit</button>
    <button id="recBtn" aria-label="Start recording"><i></i></button>
    <button class="pill glass" id="pause">Pause</button>
  </div>
  <div id="progress"></div>
</section>

<section id="done" class="hide">
  <h2>Nice take</h2>
  <video id="out" controls playsinline></video>
  <button class="go" id="save">Save video</button>
  <button class="sec" id="again">Record again</button>
</section>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const script=$('script'),speed=$('speed'),size=$('size'),text=$('text'),chunkEl=$('chunk');
const mode={get value(){return document.querySelector('input[name=mode]:checked').value},set value(v){(document.querySelector(`input[name=mode][value="${v}"]`)||$('m-scroll')).checked=true}};
script.value=store.get('script')||'';
speed.value=store.get('speed')||45;size.value=store.get('size')||30;mode.value=store.get('mode')||'scroll';
function sync(){
  $('speedV').textContent=speed.value;$('sizeV').textContent=size.value;
  text.style.fontSize=chunkEl.style.fontSize=size.value+'px';
  [speed,size].forEach(r=>r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%'));
  const n=script.value.trim()?script.value.trim().split(/\s+/).length:0,secs=Math.round(n/(speed.value*3/60));
  $('meta').textContent=n?`${n} words, about ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} at this speed`:'No script yet';
  store.set('script',script.value);store.set('speed',speed.value);store.set('size',size.value);store.set('mode',mode.value);
}
[script,speed,size].forEach(e=>e.addEventListener('input',sync));
document.querySelectorAll('input[name=mode]').forEach(e=>e.addEventListener('change',sync));sync();

let chunks2=[],ci=0,ct,stream,rec,parts=[],blob,y=0,scrolling=false,last=0,t0=0,tick;
function show(id){['edit','rec','done'].forEach(s=>$(s).classList.toggle('hide',s!==id))}

$('go').onclick=async()=>{
  if(!script.value.trim()){script.focus();return}
  text.textContent=script.value;chunks2=makeChunks(script.value);
  const c=mode.value==='chunk';$('prompt').classList.toggle('hide',c);chunkEl.classList.toggle('hide',!c);
  try{stream=stream||await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1080},height:{ideal:1920}},audio:true})}
  catch(e){$('meta').textContent='Camera and microphone access is needed. Allow it in your browser settings, then try again.';return}
  $('cam').srcObject=stream;resetScroll();show('rec');
};
function makeChunks(s){const out=[];let cur=[];
  for(const w of s.replace(/\s+/g,' ').trim().split(' ')){cur.push(w);
    if(cur.length>=4||(cur.length>=2&&/[.,!?;:—-]$/.test(w))){out.push(cur.join(' '));cur=[]}}
  if(cur.length)out.push(cur.join(' '));return out}
function setProgress(f){$('progress').style.width=Math.min(100,f*100)+'%'}
function showChunk(){chunkEl.textContent=chunks2[ci]||'';setProgress(chunks2.length?(ci+1)/chunks2.length:0)}
function nextChunk(){if(!scrolling)return;const c=chunks2[ci]||'';
  const ms=c.split(' ').length/(speed.value*3/60)*1000+(/[.!?]$/.test(c)?350:/[,;:]$/.test(c)?150:0);
  ct=setTimeout(()=>{if(!scrolling)return;if(ci<chunks2.length-1){ci++;showChunk();nextChunk()}},ms)}
function maxY(){return Math.max(0,text.scrollHeight-$('prompt').clientHeight*0.6)}
function resetScroll(){y=0;text.style.transform='translateY(0)';ci=0;showChunk();if(mode.value==='scroll')setProgress(0)}
function loop(ts){
  if(!scrolling)return;
  const dt=last?(ts-last)/1000:0;last=ts;
  y=Math.min(y+dt*speed.value,maxY());
  text.style.transform=`translateY(${-y}px)`;setProgress(y/(maxY()||1));
  requestAnimationFrame(loop);
}
function setScroll(on){scrolling=on;last=0;clearTimeout(ct);$('pause').textContent=on?'Pause':'Play';if(on){mode.value==='chunk'?nextChunk():requestAnimationFrame(loop)}}
$('pause').onclick=()=>setScroll(!scrolling);
let dragY=null;
$('prompt').addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});
$('prompt').addEventListener('touchmove',e=>{const ny=e.touches[0].clientY;y=Math.min(maxY(),Math.max(0,y-(ny-dragY)));dragY=ny;text.style.transform=`translateY(${-y}px)`},{passive:true});

function pickType(){
  for(const t of['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))return t;
  return '';
}
async function countdown(){
  const c=$('count');c.classList.remove('hide');
  for(let i=3;i>0;i--){c.firstElementChild.textContent=i;await new Promise(r=>setTimeout(r,1000))}
  c.classList.add('hide');
}
$('recBtn').onclick=async()=>{
  if(rec&&rec.state==='recording'){rec.stop();return}
  resetScroll();setScroll(false);
  await countdown();
  const type=pickType();
  rec=new MediaRecorder(stream,type?{mimeType:type,videoBitsPerSecond:8e6}:undefined);
  parts=[];
  rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
  rec.onstop=()=>{
    clearInterval(tick);setScroll(false);$('recBtn').classList.remove('on');$('recBtn').setAttribute('aria-label','Start recording');$('timer').classList.add('hide');
    blob=new Blob(parts,{type:rec.mimeType||type||'video/mp4'});
    $('out').src=URL.createObjectURL(blob);show('done');
  };
  rec.start(1000);
  $('recBtn').classList.add('on');$('recBtn').setAttribute('aria-label','Stop recording');
  t0=Date.now();$('timer').classList.remove('hide');$('timer').textContent='0:00';
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
  setScroll(true);
};
$('back').onclick=()=>{if(rec&&rec.state==='recording')return;setScroll(false);show('edit')};
$('again').onclick=()=>{resetScroll();show('rec')};
$('save').onclick=async()=>{
  const ext=blob.type.includes('mp4')?'mp4':'webm';
  const file=new File([blob],`reel-${Date.now()}.${ext}`,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;a.click();
};
</script>
</body>
</html>
