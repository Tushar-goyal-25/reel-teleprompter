<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF7F5">
<title>Prompter</title>
<meta name="description" content="A teleprompter that keeps your words right under the lens while you record.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<script defer src="/_vercel/insights/script.js"></script>
<style>
:root{--bg:#FFF7F5;--card:#FFFFFF;--line:#F3E2E3;--ink:#2B2230;--muted:#8A7B8C;--cue:#B07BE0;--pearl:linear-gradient(120deg,#F2917F,#D879B4 55%,#8F78E8);--rec:#FF4D5E;
  --font:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden}
body{position:fixed;inset:0;overscroll-behavior:none}
.hide{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{border:0;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--cue);outline-offset:2px}

/* edit */
#edit{position:absolute;top:var(--viewport-top,0px);left:0;right:0;height:var(--viewport-height,100%);display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
header{display:flex;align-items:center;gap:12px;flex-shrink:0}
header img{width:44px;height:44px;border-radius:12px;box-shadow:0 8px 20px #e7a6c855}
header h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
header p{font-size:14px;color:var(--muted)}
.sheet{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:22px;overflow:hidden}
textarea{flex:1;min-height:0;display:block;width:100%;border:0;background:transparent;padding:18px;font-size:18px;line-height:1.5;resize:none;outline:none;overflow-y:auto;overscroll-behavior-y:contain}
textarea::placeholder{color:#C2B3BF}
.meta{flex-shrink:0;padding:10px 18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.controls{flex-shrink:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px 16px}
#edit.keyboard-open .controls{display:none}
.ctl{display:flex;align-items:center;gap:12px;min-height:52px}
.ctl+.ctl{border-top:1px solid var(--line)}
.ctl label,.ctl>span:first-child{width:78px;font-size:15px;color:var(--muted)}
.ctl output{width:104px;flex:none;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
input[type=range]{flex:1;min-width:0;-webkit-appearance:none;appearance:none;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#F2917F,#D879B4 var(--p,50%),#F3E2E3 var(--p,50%))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,#F2917F,#D879B4 var(--p,50%),#F3E2E3 var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;box-shadow:0 2px 8px #d879b466,0 0 0 1px #f3e2e3}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 8px #d879b466}
.seg{position:relative;flex:1;display:flex;background:#FBEDEC;border-radius:12px;padding:3px}
.seg .thumb{position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);background:var(--card);border-radius:9px;box-shadow:0 1px 3px #2b22301a;transition:transform .25s cubic-bezier(.4,0,.2,1)}
.seg.chunk .thumb{transform:translateX(100%)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{position:relative;flex:1;width:auto;text-align:center;padding:9px 6px;border-radius:9px;font-size:15px;color:var(--muted);cursor:pointer}
.seg input:checked+label{color:var(--ink);font-weight:600}
.seg input:focus-visible+label{outline:3px solid var(--cue)}
.go{position:relative;overflow:hidden;flex-shrink:0;padding:17px;border-radius:18px;background:var(--pearl);color:#fff;font-size:18px;font-weight:700;text-shadow:0 1px 2px #6a2f6a55;box-shadow:0 10px 24px #e7a6c870}
.go::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-120%)}
.go:not(:disabled)::after{animation:sheen 5s ease-in-out infinite}
.go:active{transform:scale(.99)}
@keyframes sheen{0%,55%{transform:translateX(-120%)}85%,100%{transform:translateX(120%)}}

/* record */
#rec{position:fixed;inset:0;background:#000}
#cam,#camCanvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
.hide-visual{opacity:0;pointer-events:none}
.glass{background:#fff8f6d9;-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);color:var(--ink)}
#prompt{position:absolute;top:0;left:0;right:0;height:25%;padding-top:env(safe-area-inset-top);overflow:hidden;border-radius:0 0 26px 26px;
  -webkit-mask-image:linear-gradient(#0004,#000 38%,#000 58%,#0004);mask-image:linear-gradient(#0004,#000 38%,#000 58%,#0004)}
#text{max-width:min(72vw,300px);margin:0 auto;text-align:center;padding:0;font-weight:650;line-height:1.35;white-space:pre-wrap;will-change:transform}
#chunk{position:absolute;top:calc(env(safe-area-inset-top) + 18px);left:50%;transform:translateX(-50%);width:min(80vw,330px);
  text-align:center;font-weight:700;line-height:1.25;border-radius:22px;padding:14px 16px;min-height:1.6em;box-shadow:0 10px 30px #0003}
#chunk.pop{animation:chunkIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes chunkIn{from{opacity:0;transform:translate(-50%,8px) scale(.96)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
#flipCam,#torch{position:absolute;right:18px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
#flipCam{top:calc(env(safe-area-inset-top) + 18px)}
#torch{top:calc(env(safe-area-inset-top) + 72px)}
#torch.on{background:#FFE9A8}
#zoomWrap{position:absolute;top:50%;right:14px;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;border-radius:999px;padding:14px 10px}
#zoomWrap output{font-size:12px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
#zoomWrap .slider{position:relative;width:28px;height:140px}
#zoomWrap input{position:absolute;top:50%;left:50%;width:140px;height:28px;flex:none;transform:translate(-50%,-50%) rotate(-90deg)}
#progress{position:absolute;left:0;bottom:0;height:3px;background:var(--pearl);width:0;transition:width .2s linear}
#bar{position:absolute;bottom:0;left:0;right:0;padding:16px 22px calc(env(safe-area-inset-bottom) + 22px);display:flex;align-items:center;justify-content:space-between}
.pill{padding:12px 16px;border-radius:999px;font-size:15px;font-weight:600;min-width:76px}
#recBtn{position:relative;width:78px;height:78px;border-radius:50%;background:#fff8f6e6;display:grid;place-items:center;box-shadow:0 6px 20px #0004}
#recBtn::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid var(--rec);opacity:0}
#recBtn.on::before{animation:recPulse 1.6s ease-out infinite}
@keyframes recPulse{0%{opacity:.65;transform:scale(.8)}100%{opacity:0;transform:scale(1.4)}}
#recBtn i{display:block;width:58px;height:58px;border-radius:50%;background:var(--rec);transition:all .2s}
#recBtn.on i{width:28px;height:28px;border-radius:8px}
#count{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#count span{width:128px;height:128px;border-radius:50%;display:grid;place-items:center;font-size:64px;font-weight:700}
#count span.pop{animation:countPop .9s cubic-bezier(.2,.8,.2,1)}
@keyframes countPop{0%{opacity:0;transform:scale(1.5)}30%{opacity:1;transform:scale(1)}80%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.85)}}
#timer{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 118px);left:50%;transform:translateX(-50%);padding:5px 12px;border-radius:999px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:7px}
#timer::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rec);animation:dotPulse 1.4s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.35}}
#recStatus{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 150px);left:18px;right:18px;text-align:center;border-radius:12px;padding:10px}

/* done */
#done{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 18px) 18px calc(env(safe-area-inset-bottom) + 18px)}
#done h2{font-size:22px}
#out{flex:1;min-height:0;width:100%;object-fit:contain;border-radius:22px;background:#F6E6E6}
.sec{padding:16px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:600}
@media(max-height:520px){#edit{gap:8px;padding-top:8px;padding-bottom:8px}header p{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<section id="edit">
  <header>
    <img src="/icon.svg" alt="">
    <div><h1>Prompter</h1><p>Your words, right under the lens.</p></div>
  </header>
  <div class="sheet">
    <textarea id="script" aria-label="Script" placeholder="Paste or type your script. It saves on this phone as you go."></textarea>
    <div class="meta" id="meta">No script yet</div>
  </div>
  <div class="controls">
    <div class="ctl"><span>Mode</span>
      <div class="seg" id="modeSeg" role="radiogroup" aria-label="Mode">
        <span class="thumb" aria-hidden="true"></span>
        <input type="radio" name="mode" id="m-scroll" value="scroll"><label for="m-scroll">Scroll</label>
        <input type="radio" name="mode" id="m-chunk" value="chunk"><label for="m-chunk">Phrases</label>
      </div></div>
    <div class="ctl"><label for="speed">Speed</label><input id="speed" type="range" min="10" max="150" value="45"><output id="speedV"></output></div>
    <div class="ctl"><label for="size">Text size</label><input id="size" type="range" min="18" max="56" value="30"><output id="sizeV"></output></div>
  </div>
  <button class="go" id="go">Open camera</button>
</section>

<section id="rec" class="hide">
  <video id="cam" autoplay playsinline muted class="mirror"></video>
  <canvas id="camCanvas" class="mirror hide"></canvas>
  <div id="prompt" class="glass"><div id="text"></div></div>
  <div id="chunk" class="glass hide"></div>
  <button id="flipCam" class="glass hide" aria-label="Switch camera">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
    </svg>
  </button>
  <button id="torch" class="glass hide" aria-label="Toggle flash">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M13 2 3 14h7l-1 8 11-14h-7z"/></svg>
  </button>
  <div id="zoomWrap" class="glass hide">
    <output id="zoomV">1.0x</output>
    <div class="slider"><input id="zoom" type="range" min="1" max="4" step="0.1" value="1" aria-label="Zoom"></div>
  </div>
  <div id="timer" class="glass hide">0:00</div>
  <div id="count" class="hide"><span class="glass"></span></div>
  <div id="bar">
    <button class="pill glass" id="back">Edit</button>
    <button id="recBtn" aria-label="Start recording"><i></i></button>
    <button class="pill glass" id="pause" disabled>Pause</button>
  </div>
  <div id="progress"></div>
  <p id="recStatus" class="glass hide" role="status"></p>
</section>

<section id="done" class="hide">
  <h2>Nice take</h2>
  <video id="out" controls playsinline></video>
  <button class="go" id="save">Save video</button>
  <button class="sec" id="again">Record again</button>
  <button class="sec" id="cancel">Cancel</button>
</section>

<script>
const $=id=>document.getElementById(id);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const script=$('script'),speed=$('speed'),size=$('size'),text=$('text'),chunkEl=$('chunk');
// iOS keyboards resize and pan the visual viewport, not the layout viewport.
function fitEditor(){
  const v=window.visualViewport,h=v?v.height:window.innerHeight;
  document.documentElement.style.setProperty('--viewport-height',h+'px');
  document.documentElement.style.setProperty('--viewport-top',(v?v.offsetTop:0)+'px');
  $('edit').classList.toggle('keyboard-open',document.activeElement===script&&(h<500||h<document.documentElement.clientHeight-120));
}
window.visualViewport?.addEventListener('resize',fitEditor);
window.visualViewport?.addEventListener('scroll',fitEditor);
window.addEventListener('resize',fitEditor);
script.addEventListener('focus',fitEditor);script.addEventListener('blur',fitEditor);fitEditor();
const mode={get value(){return document.querySelector('input[name=mode]:checked').value},set value(v){(document.querySelector(`input[name=mode][value="${v}"]`)||$('m-scroll')).checked=true}};
script.value=store.get('script')||'';
speed.value=store.get('speed')||45;size.value=store.get('size')||30;mode.value=store.get('mode')||'scroll';
function sync(){
  $('speedV').textContent=speed.value*3+' words/min';const z=+size.value;$('sizeV').textContent=z<24?'Small':z<34?'Medium':z<44?'Large':'Extra large';
  text.style.fontSize=chunkEl.style.fontSize=size.value+'px';
  [speed,size].forEach(r=>r.style.setProperty('--p',(r.value-r.min)/(r.max-r.min)*100+'%'));
  const n=script.value.trim()?script.value.trim().split(/\s+/).length:0,secs=Math.round(n/(speed.value*3/60));
  $('meta').textContent=n?`${n} words, about ${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} at this speed`:'No script yet';
  $('modeSeg').classList.toggle('chunk',mode.value==='chunk');
  store.set('script',script.value);store.set('speed',speed.value);store.set('size',size.value);store.set('mode',mode.value);
}
[script,speed,size].forEach(e=>e.addEventListener('input',sync));
document.querySelectorAll('input[name=mode]').forEach(e=>e.addEventListener('change',sync));sync();

let chunks2=[],ci=0,ct,stream,rec,parts=[],blob,takeURL,y=0,scrolling=false,last=0,t0=0,tick,frame,starting=false;
let facing='user',vtrack=null,nativeZoom=false,zoomCanvasActive=false,zoomFrame=0,fallbackZoomVal=1,torchOn=false;
function show(id){['edit','rec','done'].forEach(s=>$(s).classList.toggle('hide',s!==id))}

$('go').onclick=async()=>{
  if(!script.value.trim()){script.focus();return}
  if(!window.MediaRecorder){$('meta').textContent='Video recording is not supported in this browser.';return}
  script.blur();$('go').disabled=true;
  text.textContent=script.value;chunks2=makeChunks(script.value);
  const c=mode.value==='chunk';$('prompt').classList.toggle('hide',c);chunkEl.classList.toggle('hide',!c);
  try{stream=stream||await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1080},height:{ideal:1920}},audio:true})}
  catch(e){$('meta').textContent='Camera and microphone access is needed. Allow it in your browser settings, then try again.';return}
  finally{$('go').disabled=false}
  $('cam').srcObject=stream;show('rec');resetScroll();$('pause').disabled=true;$('recStatus').classList.add('hide');
  setupCameraControls();
};
function setupCameraControls(){
  vtrack=stream?.getTracks().find(t=>t.kind==='video')||null;
  const caps=vtrack?.getCapabilities?.()||{};
  nativeZoom=!!(caps.zoom&&caps.zoom.max>caps.zoom.min);
  const canvasZoomSupported=typeof $('camCanvas').getContext==='function'&&typeof $('camCanvas').captureStream==='function';
  torchOn=false;$('torch').classList.remove('on');$('torch').classList.toggle('hide',!caps.torch);
  const zoomOn=nativeZoom||canvasZoomSupported;
  $('zoomWrap').classList.toggle('hide',!zoomOn);
  if(zoomOn){
    const min=nativeZoom?caps.zoom.min:1,max=nativeZoom?caps.zoom.max:4,step=nativeZoom?(caps.zoom.step||.1):.1;
    Object.assign($('zoom'),{min,max,step,value:min});fallbackZoomVal=min;$('zoomV').textContent=min.toFixed(1)+'x';
  }
  stopCanvasZoom();
  $('cam').classList.toggle('mirror',facing==='user');$('camCanvas').classList.toggle('mirror',facing==='user');
  navigator.mediaDevices.enumerateDevices?.()?.then(list=>{
    $('flipCam').classList.toggle('hide',list.filter(d=>d.kind==='videoinput').length<2);
  }).catch(()=>{});
}
function drawZoomFrame(){
  if(!zoomCanvasActive)return;
  const vid=$('cam'),cv=$('camCanvas'),w=vid.videoWidth,h=vid.videoHeight;
  if(w){cv.width=w;cv.height=h;const v=fallbackZoomVal,sw=w/v,sh=h/v;
    cv.getContext('2d').drawImage(vid,(w-sw)/2,(h-sh)/2,sw,sh,0,0,w,h)}
  zoomFrame=requestAnimationFrame(drawZoomFrame);
}
function startCanvasZoom(){
  if(zoomCanvasActive)return;zoomCanvasActive=true;
  $('camCanvas').classList.remove('hide');$('cam').classList.add('hide-visual');
  drawZoomFrame();
}
function stopCanvasZoom(){
  zoomCanvasActive=false;cancelAnimationFrame(zoomFrame);
  $('camCanvas').classList.add('hide');$('cam').classList.remove('hide-visual');
}
$('zoom').oninput=()=>{
  const v=+$('zoom').value;fallbackZoomVal=v;$('zoomV').textContent=v.toFixed(1)+'x';
  if(nativeZoom)vtrack?.applyConstraints?.({advanced:[{zoom:v}]}).catch(()=>{});
  else if(v>1)startCanvasZoom();else stopCanvasZoom();
};
$('torch').onclick=()=>{
  const next=!torchOn;
  vtrack?.applyConstraints?.({advanced:[{torch:next}]}).then(()=>{torchOn=next;$('torch').classList.toggle('on',torchOn)}).catch(()=>{});
};
$('flipCam').onclick=async()=>{
  if($('flipCam').disabled||rec?.state==='recording')return;
  const prev=facing;facing=facing==='user'?'environment':'user';
  stream?.getTracks().forEach(t=>t.stop());stream=null;$('cam').srcObject=null;
  const constraints=f=>({video:{facingMode:f,width:{ideal:1080},height:{ideal:1920}},audio:true});
  try{stream=await navigator.mediaDevices.getUserMedia(constraints(facing))}
  catch(e){facing=prev;try{stream=await navigator.mediaDevices.getUserMedia(constraints(facing))}catch(e2){return}}
  $('cam').srcObject=stream;setupCameraControls();
};
function makeChunks(s){const out=[];let cur=[];
  for(const w of s.replace(/\s+/g,' ').trim().split(' ')){cur.push(w);
    if(cur.length>=4||(cur.length>=2&&/[.,!?;:—-]$/.test(w))){out.push(cur.join(' '));cur=[]}}
  if(cur.length)out.push(cur.join(' '));return out}
function setProgress(f){$('progress').style.width=Math.max(0,Math.min(100,f*100))+'%'}
function showChunk(){chunkEl.textContent=chunks2[ci]||'';setProgress(chunks2.length?(ci+1)/chunks2.length:0);
  chunkEl.classList.remove('pop');void chunkEl.offsetWidth;chunkEl.classList.add('pop')}
function nextChunk(){if(!scrolling)return;const c=chunks2[ci]||'';
  const ms=c.split(' ').length/(speed.value*3/60)*1000+(/[.!?]$/.test(c)?350:/[,;:]$/.test(c)?150:0);
  ct=setTimeout(()=>{if(!scrolling)return;if(ci<chunks2.length-1){ci++;showChunk();nextChunk()}},ms)}
function maxY(){return Math.max(0,text.scrollHeight-parseFloat(text.style.paddingTop||0)-parseFloat(getComputedStyle(text).lineHeight))}
function resetScroll(){
  setScroll(false);
  const prompt=$('prompt'),line=parseFloat(getComputedStyle(text).lineHeight),safeTop=parseFloat(getComputedStyle(prompt).paddingTop);
  text.style.paddingTop=Math.max(0,(prompt.clientHeight-safeTop-line)/2)+'px';
  // Keep line one in the reading zone until recording starts.
  y=0;
  text.style.transform=`translateY(${-y}px)`;ci=0;showChunk();setProgress(0);
}
function loop(ts){
  if(!scrolling)return;
  const dt=last?(ts-last)/1000:0;last=ts;
  y=Math.min(y+dt*speed.value,maxY());
  text.style.transform=`translateY(${-y}px)`;setProgress(y/(maxY()||1));
  frame=requestAnimationFrame(loop);
}
function setScroll(on){cancelAnimationFrame(frame);scrolling=on;last=0;clearTimeout(ct);$('pause').textContent=on?'Pause':'Play';if(on){mode.value==='chunk'?nextChunk():frame=requestAnimationFrame(loop)}}
$('pause').onclick=()=>{if(rec?.state==='recording')setScroll(!scrolling)};
let dragY=null;
$('prompt').addEventListener('touchstart',e=>{dragY=e.touches[0].clientY},{passive:true});
$('prompt').addEventListener('touchmove',e=>{if(starting)return;const ny=e.touches[0].clientY;y=Math.min(maxY(),Math.max(0,y-(ny-dragY)));dragY=ny;text.style.transform=`translateY(${-y}px)`},{passive:true});

function pickType(){
  for(const t of['video/mp4;codecs=avc1,mp4a','video/mp4','video/webm;codecs=vp9,opus','video/webm'])
    if(window.MediaRecorder&&MediaRecorder.isTypeSupported(t))return t;
  return '';
}
async function countdown(){
  const c=$('count'),span=c.firstElementChild;c.classList.remove('hide');
  for(let i=3;i>0;i--){span.textContent=i;span.classList.remove('pop');void span.offsetWidth;span.classList.add('pop');await new Promise(r=>setTimeout(r,1000))}
  c.classList.add('hide');
}
$('recBtn').onclick=async()=>{
  if(starting)return;
  if(rec&&rec.state==='recording'){$('recBtn').disabled=true;setScroll(false);rec.stop();return}
  starting=true;$('recBtn').disabled=true;$('back').disabled=true;$('pause').disabled=true;
  $('recStatus').classList.add('hide');resetScroll();
  try{
    await countdown();
    const type=pickType();
    const useCanvas=!nativeZoom&&zoomCanvasActive&&typeof $('camCanvas').captureStream==='function';
    const recordStream=useCanvas?new MediaStream([...$('camCanvas').captureStream(30).getVideoTracks(),...stream.getTracks().filter(t=>t.kind==='audio')]):stream;
    rec=new MediaRecorder(recordStream,type?{mimeType:type,videoBitsPerSecond:8e6}:undefined);
    const recorder=rec;parts=[];let failed=false;
    rec.ondataavailable=e=>e.data.size&&parts.push(e.data);
    rec.onerror=()=>{failed=true;recordingError()};
    rec.onstop=()=>{
      resetRecordingControls();
      if(failed)return;
      if(!parts.length){recordingError();return}
      const data=parts;discardTake();blob=new Blob(data,{type:recorder.mimeType||type||'video/mp4'});
      takeURL=URL.createObjectURL(blob);$('out').src=takeURL;show('done');
    };
    rec.start(1000);
    $('recBtn').classList.add('on');$('recBtn').setAttribute('aria-label','Stop recording');
    t0=Date.now();$('timer').classList.remove('hide');$('timer').textContent='0:00';
    tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`},500);
    $('pause').disabled=false;setScroll(true);
    $('zoom').disabled=!nativeZoom;$('flipCam').disabled=true;
  }catch(e){recordingError()}
  finally{starting=false;$('recBtn').disabled=false;if(rec?.state!=='recording')$('back').disabled=false}
};
function resetRecordingControls(){
  clearInterval(tick);setScroll(false);$('recBtn').disabled=false;$('back').disabled=false;$('pause').disabled=true;
  $('recBtn').classList.remove('on');$('recBtn').setAttribute('aria-label','Start recording');$('timer').classList.add('hide');
  $('zoom').disabled=false;$('flipCam').disabled=false;
}
function recordingError(){resetRecordingControls();$('recStatus').textContent='Could not record this take. Please try again.';$('recStatus').classList.remove('hide')}
function discardTake(){
  $('out').pause();$('out').removeAttribute('src');$('out').load();
  if(takeURL)URL.revokeObjectURL(takeURL);takeURL=null;blob=null;parts=[];
}
function returnToEditor(){
  setScroll(false);discardTake();stopCanvasZoom();stream?.getTracks().forEach(t=>t.stop());stream=null;$('cam').srcObject=null;rec=null;facing='user';
  show('edit');fitEditor();
}
$('back').onclick=()=>{if(starting||rec?.state==='recording')return;returnToEditor()};
$('again').onclick=()=>{discardTake();show('rec');resetScroll()};
$('cancel').onclick=returnToEditor;
$('save').onclick=async()=>{
  if(!blob)return;
  const ext=blob.type.includes('mp4')?'mp4':'webm';
  const file=new File([blob],`reel-${Date.now()}.${ext}`,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return}catch(e){if(e.name==='AbortError')return}
  }
  const a=document.createElement('a');a.href=takeURL;a.download=file.name;a.click();
};
</script>
